<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#175939" />
      <stop offset="65%" stop-color="#0b2d1d" />
      <stop offset="100%" stop-color="#061910" />
    </radialGradient>
    <linearGradient id="chamBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>
    <linearGradient id="tongueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
  </defs>

  <!-- Full-bleed rainforest backdrop -->
  <rect width="512" height="512" fill="url(#bg)" />

  <!-- Subtle leaf silhouettes -->
  <path d="M0 150 Q110 110 155 0 L0 0 Z" fill="#13452c" opacity="0.7" />
  <path d="M512 130 Q400 95 365 0 L512 0 Z" fill="#13452c" opacity="0.7" />

  <!-- Mossy branch -->
  <path d="M28 386 Q256 350 484 382 L484 432 Q256 402 28 438 Z" fill="#59331c" />
  <ellipse cx="185" cy="368" rx="64" ry="12" fill="#228b3b" />
  <ellipse cx="332" cy="366" rx="52" ry="11" fill="#34b44e" />

  <!-- Curled tail -->
  <path
    d="M170 342 C110 330, 74 378, 108 402 C134 420, 158 388, 134 370 C118 358, 106 376, 120 384"
    fill="none"
    stroke="#0f766e"
    stroke-width="26"
    stroke-linecap="round"
  />
  <path
    d="M170 340 C114 328, 82 374, 110 398"
    fill="none"
    stroke="#a3e635"
    stroke-width="11"
    stroke-linecap="round"
  />

  <!-- Chameleon body -->
  <path
    d="M148 340 C134 264, 210 212, 286 232 C328 244, 340 302, 304 344 C264 368, 178 368, 148 340 Z"
    fill="url(#chamBody)"
  />
  <!-- Belly trim -->
  <path d="M182 348 Q248 366 302 336 Q250 344 182 348 Z" fill="#fde047" />

  <!-- Dorsal spikes -->
  <polygon points="164,284 150,256 180,270" fill="#f59e0b" />
  <polygon points="196,252 188,220 216,242" fill="#f59e0b" />
  <polygon points="236,232 234,200 258,228" fill="#f59e0b" />

  <!-- Legs gripping branch -->
  <path d="M176 334 Q188 356 184 370" fill="none" stroke="#15803d" stroke-width="18" stroke-linecap="round" />
  <path d="M276 336 Q288 356 286 370" fill="none" stroke="#16a34a" stroke-width="18" stroke-linecap="round" />

  <!-- Chameleon head & casque -->
  <path d="M262 238 Q248 182 288 176 Q316 192 312 224 Z" fill="#0d9488" />
  <path
    d="M254 248 C252 198, 304 184, 344 214 Q368 232 356 248 L286 254 Z"
    fill="url(#chamBody)"
  />
  <path d="M264 252 L352 264 Q330 288 272 276 Z" fill="#65a30d" />
  <path d="M286 248 L354 248 L342 264 L282 258 Z" fill="#881337" />

  <!-- Turret Eye -->
  <circle cx="294" cy="224" r="28" fill="#22c55e" stroke="#14532d" stroke-width="4" />
  <circle cx="294" cy="224" r="21" fill="#fde047" />
  <circle cx="294" cy="224" r="15" fill="#fefce8" />
  <circle cx="300" cy="218" r="9" fill="#b45309" />
  <circle cx="301" cy="217" r="6" fill="#090d0b" />
  <circle cx="298" cy="214" r="2.5" fill="#ffffff" />

  <!-- Stretchy Pink Tongue -->
  <path
    d="M342 255 Q378 214 398 158"
    fill="none"
    stroke="url(#tongueGrad)"
    stroke-width="16"
    stroke-linecap="round"
  />
  <circle cx="400" cy="154" r="18" fill="#fb7185" />
  <circle cx="395" cy="148" r="6" fill="#ffe4e6" />

  <!-- Buzzing Fly at tongue tip -->
  <ellipse cx="420" cy="128" rx="18" ry="10" transform="rotate(-35 420 128)" fill="#ecfdf5" opacity="0.85" />
  <ellipse cx="386" cy="124" rx="18" ry="10" transform="rotate(25 386 124)" fill="#ecfdf5" opacity="0.85" />
  <ellipse cx="405" cy="140" rx="14" ry="10" fill="#1e293b" />
  <circle cx="416" cy="136" r="5" fill="#f97316" />
</svg>
